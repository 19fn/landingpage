name: CI

on:
  pull_request:
  push:
    branches:
      - develop
  # schedule:
  #   - cron: "17 5 * * 1"
  # Called by Deploy so pushes to main pass CI before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
