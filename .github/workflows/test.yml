name: Test

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.4"

      - name: Validate static site files
        run: |
          node --check app.js
          python3 -m json.tool health.json >/dev/null
          test -f assets/favicon.svg
          test -f index.html
          test -f 404.html
          test -f styles.css
          grep -q 'assets/favicon.svg' index.html

      - name: Validate Terraform formatting and configuration
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Verify public deployment map
        working-directory: infrastructure/terraform
        run: |
          printf 'sort(keys(local.public_files))\n' | terraform console \
            -var='subscription_id=00000000-0000-0000-0000-000000000000' \
            -var='resource_group_name=rg-ci-validation' \
            -var='resource_group_location=eastus' \
            -var='storage_account_name=stcivalidation123' \
            -var='custom_domain_name=www.example.com' \
            -var='dns_zone_name=example.com' \
            -var='dns_zone_resource_group_name=rg-dns-ci' \
            | grep -E 'health\.json|assets/favicon\.svg'